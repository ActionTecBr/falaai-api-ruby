name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Syntax check (ruby -c, lib/**)
        run: find lib -type f -name "*.rb" -print0 | xargs -0 -n1 ruby -c -q > /dev/null && echo "ruby syntax ok"
      - name: Build gem
        run: gem build falaai-api.gemspec
